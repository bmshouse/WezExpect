# Wez Expect Configuration

[monitor]
# How often to check the terminal for timeout messages (in seconds)
poll_interval_secs = 30
lookback_lines = 10

[pane]
# Optional: Specify a specific WezTerm pane ID to monitor
# If not specified, the first available pane will be auto-selected
# To find pane IDs, run: wezterm cli list
# pane_id = 1

# Rules - each rule defines a pattern to watch for and an action to take
# Rules are checked in order, and the first matching enabled rule wins

[[rules]]
name = "timeout_message"  # Optional descriptive name for logging
pattern = "You've hit your limit · resets (\\d{1,2}(?::\\d{2})?\\s?(?:am|pm)) \\((.*?)\\)"
action_type = "wait_for_time"  # "wait_for_time" or "immediate"
command = "1continue\r"
enabled = true  # Optional, defaults to true

[[rules]]
name = "Proceed"
pattern = "Do you want to proceed"
action_type = "immediate"
command = "\r"
enabled = true
